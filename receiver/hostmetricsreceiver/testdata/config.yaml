host_metrics:
  scrapers:
    cpu:

host_metrics/customname:
  collection_interval: 30s
  scrapers:
    cpu:
    disk:
    load:
      cpu_average: true
    filesystem:
    memory:
    network:
      include:
        interfaces: ["test1"]
        match_type: "strict"
    nfs:
    paging:
    processes:
    process:
      include:
        names: ["test2", "test3"]
        match_type: "regexp"
    system:

host_metrics/resourceattributes:
  resource_attributes:
    host.id:
      enabled: false
    service.instance.id:
      enabled: true
  scrapers:
    cpu:
