# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. receiver/filelog)
component: receiver/host_metrics

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Detect host identity in the receiver and expose it as the host.id, host.name and service.instance.id resource attributes

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [46207]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The whole feature is behind the alpha `receiver.hostmetricsreceiver.HostIdentity` feature gate,
  which is disabled by default, so existing pipelines are unaffected until they opt in.
  With the gate enabled, host.id and host.name are detected at startup and attached by default, so
  host metrics carry host identity without requiring the resourcedetection processor.
  service.instance.id is a deterministic UUID v5 derived from host.id, falling back to host.name,
  which supplies the identifying resource attribute that OTLP-to-Prometheus translation needs to
  emit target_info and an instance label. It stays off until enabled under `resource_attributes`,
  and is never set on process scraper resources, which all describe the same host and would
  therefore share a single ID. Each of the three can be toggled under `resource_attributes`.

